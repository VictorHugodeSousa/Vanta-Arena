const playedMatches=()=>db.competition.matches.filter(m=>m.status==='finished'&&db.draft.teams.some(t=>t.id===m.teamA)&&db.draft.teams.some(t=>t.id===m.teamB));
const teamById=id=>db.draft.teams.find(t=>t.id===id);
const groupList=()=>[...new Set(db.draft.teams.map(t=>String(t.group||'A').toUpperCase()))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
const matchDate=m=>m.date?new Date(m.date+'T12:00:00').toLocaleDateString('pt-BR'):'A definir';
const teamLabel=id=>esc(teamById(id)?.name||'Time removido');

function standings(group){
 const teams=db.draft.teams.filter(t=>String(t.group||'A').toUpperCase()===group);
 return teams.map(t=>{
   let s={team:t,j:0,v:0,d:0,pts:0,rf:0,rs:0,sg:0};
   playedMatches().filter(m=>m.stage==='groups'&&String(m.group||'A').toUpperCase()===group&&(m.teamA===t.id||m.teamB===t.id)).forEach(m=>{
     const own=m.teamA===t.id, ownScore=own?Number(m.scoreA):Number(m.scoreB), oppScore=own?Number(m.scoreB):Number(m.scoreA);
     s.j++;s.rf+=ownScore;s.rs+=oppScore;if(ownScore>oppScore){s.v++;s.pts+=3;}else{s.d++;}
   });s.sg=s.rf-s.rs;return s;
 }).sort((a,b)=>b.pts-a.pts||b.v-a.v||b.sg-a.sg||b.rf-a.rf||a.team.name.localeCompare(b.team.name,'pt-BR'));
}
function officialStats(playerId){
 const entries=[];
 for(const m of playedMatches()){
   const item=(m.playerStats||[]).find(x=>x.playerId===playerId);
   if(!item)continue;
   const rounds=(Number(m.scoreA)||0)+(Number(m.scoreB)||0);
   const teamId=m.teamA===item.teamId||m.teamB===item.teamId?item.teamId:(rosterOf(teamById(m.teamA)||{}).some(p=>p.id===playerId)?m.teamA:m.teamB);
   entries.push({...item,match:m,rounds,won:teamId===m.teamA?Number(m.scoreA)>Number(m.scoreB):Number(m.scoreB)>Number(m.scoreA)});
 }
 const games=entries.length,kills=entries.reduce((x,v)=>x+Number(v.kills||0),0),deaths=entries.reduce((x,v)=>x+Number(v.deaths||0),0),assists=entries.reduce((x,v)=>x+Number(v.assists||0),0),wins=entries.filter(e=>e.won).length;
 const adrEntries=entries.filter(v=>v.adr!==null&&v.adr!==undefined&&v.adr!==''),adrRounds=adrEntries.reduce((n,v)=>n+v.rounds,0);
 const adr=adrRounds?adrEntries.reduce((n,v)=>n+Number(v.adr)*v.rounds,0)/adrRounds:null;
 const hsEntries=entries.filter(v=>v.headshots!==null&&v.headshots!==undefined&&v.headshots!==''),hsKills=hsEntries.reduce((n,v)=>n+Number(v.kills||0),0),headshots=hsEntries.reduce((n,v)=>n+Number(v.headshots||0),0);
 return {games,kills,deaths,assists,wins,winrate:games?wins/games*100:null,kd:games?(deaths?kills/deaths:kills):null,adr,hs:hsKills?headshots/hsKills*100:null};
}
function officialRanking(){return db.players.map(p=>({p,s:officialStats(p.id)})).filter(x=>x.s.games>0).sort((a,b)=>(b.s.kd??0)-(a.s.kd??0)||(b.s.adr??0)-(a.s.adr??0)||b.s.kills-a.s.kills||a.p.nick.localeCompare(b.p.nick,'pt-BR'));}
function officialPosition(id){const n=officialRanking().findIndex(x=>x.p.id===id);return n<0?null:n+1;}

function renderStandings(){const groups=groupList().filter(g=>ui.tableGroup==='Todos'||ui.tableGroup===g);const groupMatches=playedMatches().filter(m=>m.stage==='groups');const total=groupMatches.length;return `<div class="page-intro"><div><span class="eyebrow">CAMPEONATO / CLASSIFICAÇÃO</span><h1 class="heading">TABELA <span>DE GRUPOS</span></h1><p class="subheading">Atualizada automaticamente pelos placares finalizados da fase de grupos. Vitória: 3 pontos · derrota: 0.</p></div>${canEdit()?`<button class="btn btn-primary" data-action="open-admin-matches">${ico('plus')} REGISTRAR PARTIDA</button>`:''}</div><section class="competition-strip"><div><small>PARTIDAS FINALIZADAS</small><strong>${total}</strong></div><div><small>GRUPOS</small><strong>${groupList().length}</strong></div><div><small>EQUIPES</small><strong>${db.draft.teams.length}</strong></div><p>Critérios de desempate: pontos, vitórias, saldo de rounds e rounds pró. Sem resultados fictícios.</p></section><div class="competition-filter">${['Todos',...groupList()].map(g=>`<button class="role-btn ${ui.tableGroup===g?'active':''}" data-group="${esc(g)}">${g==='Todos'?'TODOS OS GRUPOS':'GRUPO '+esc(g)}</button>`).join('')}</div><div class="standings-grid">${groups.map(g=>`<section class="standings-card"><header>${groupChip(g)}<span>${standings(g).length} TIMES</span></header><div class="table-scroll"><table class="data-table competition-table"><thead><tr><th>#</th><th>TIME</th><th>PTS</th><th>J</th><th>V</th><th>D</th><th>RP</th><th>RC</th><th>SR</th></tr></thead><tbody>${renderStandingsRows(g)}</tbody></table></div></section>`).join('')||emptyState('Sem grupos','Cadastre times e defina seus grupos na área administrativa.')}</div><div class="competition-footnote">PTS = pontos · J = jogos · V = vitórias · D = derrotas · RP = rounds pró · RC = rounds contra · SR = saldo de rounds. Apenas partidas finalizadas da fase de grupos entram na classificação. No celular, deslize a tabela para os lados para ver todas as colunas.</div><div class="standings-next"><div><span class="eyebrow">AGENDA E RESULTADOS</span><h2 class="heading">PARTIDAS <span>DO CAMPEONATO</span></h2></div><button class="btn" data-route="history">${ico('arrow')} VER TODAS AS PARTIDAS</button></div>${renderMatchCards(db.competition.matches.slice().sort(sortMatches).slice(0,6))}</div>`;}

function rosterFiltered(){let arr=db.players.slice().filter(p=>ui.role==='Todos'||p.role===ui.role).filter(p=>(`${p.nick} ${p.name} ${p.role} ${p.flag}`).toLowerCase().includes(ui.q.toLowerCase()));if(ui.sort==='kd')arr.sort((a,b)=>(officialStats(b.id).kd??-1)-(officialStats(a.id).kd??-1)||a.nick.localeCompare(b.nick));else if(ui.sort==='premier')arr.sort((a,b)=>b.premier-a.premier);else if(ui.sort==='rank')arr.sort((a,b)=>(officialPosition(a.id)??9999)-(officialPosition(b.id)??9999)||a.nick.localeCompare(b.nick));else arr.sort((a,b)=>a.nick.localeCompare(b.nick,'pt-BR'));return arr;}

function renderPlayers(){return `${renderHomeNews()}<section class="roster-intro"><div><span class="eyebrow">${esc(db.eventName)} / ELENCO OFICIAL</span><h1 class="heading">JOGADORES <span>DO CAMPEONATO</span></h1><p class="subheading">Dados do campeonato só começam a contar após as partidas oficiais. FACEIT, GC e Premier são referências externas nos perfis.</p></div><button class="btn btn-ghost" data-route="standings">${ico('trophy')} TABELA DE GRUPOS</button></section><div class="roster-tools"><div class="section-controls"><label class="search-input">${ico('search')}<input id="rosterSearch" value="${esc(ui.q)}" placeholder="Buscar jogador..." aria-label="Buscar jogador"></label><select id="rosterSort" class="select" aria-label="Ordenar jogadores"><option value="nick" ${ui.sort==='nick'?'selected':''}>Nome A–Z</option><option value="rank" ${ui.sort==='rank'?'selected':''}>Ranking do campeonato</option><option value="kd" ${ui.sort==='kd'?'selected':''}>Maior K/D do campeonato</option><option value="premier" ${ui.sort==='premier'?'selected':''}>Maior Premier (externo)</option></select></div></div><div class="filter-row"><div class="role-filters">${['Todos',...ROLES].map(r=>`<button class="role-btn ${ui.role===r?'active':''}" data-role="${esc(r)}">${esc(r)}</button>`).join('')}</div><span class="result-count" id="rosterCount">${rosterFiltered().length} JOGADORES</span></div><section id="playersGrid" class="players-grid">${rosterFiltered().map(renderPlayerCard).join('')||emptyState('Nenhum jogador encontrado','Tente mudar a busca ou os filtros.')}</section>`;}
function emptyState(title,description){return `<div class="empty-state" style="grid-column:1/-1">${ico('search')}<h3>${esc(title)}</h3><p>${esc(description)}</p></div>`;}
function refreshRoster(){if($('#playersGrid'))$('#playersGrid').innerHTML=rosterFiltered().map(renderPlayerCard).join('')||emptyState('Nenhum jogador encontrado','Tente mudar a busca ou os filtros.');if($('#rosterCount'))$('#rosterCount').textContent=`${rosterFiltered().length} RESULTADOS`;}
function renderDraftPlayer(p){return `<div class="draft-player-row">${portrait(p,'draft-avatar')}<div class="draft-name"><strong>${esc(p.nick)} <span class="muted">#${p.rank}</span></strong><small>${esc(p.role)} · K/D ${fmt(p.kd)}</small></div><div class="draft-row-score">${p.faceit}<small>FACEIT</small></div><button class="btn btn-sm ${db.draft.status==='live'?'btn-primary':''}" data-pick="${esc(p.id)}" ${db.draft.status!=='live'?'disabled':''}>${ico('plus')} ESCOLHER</button></div>`;}
function renderTeam(team){const members=rosterOf(team),active=nextTeam()?.id===team.id;return `<section class="team-panel ${active?'active-team':''}" style="--teamcolor:${esc(team.color)}"><header class="team-header"><div class="team-logo">${esc(team.tag.slice(0,1))}</div><div><h3>${esc(team.name)}</h3><small>${members.length}/${db.draft.maxPlayers} jogadores ${active?'· É SUA VEZ':''}</small></div></header><div class="team-roster">${Array.from({length:db.draft.maxPlayers},(_,i)=>{const p=members[i];return `<div class="team-slot ${p?'':'empty-slot'}"><span class="slot-index">${String(i+1).padStart(2,'0')}</span>${p?`${portrait(p,'slot-photo')}<div style="min-width:0;flex:1"><strong>${esc(p.nick)}</strong><small>${esc(p.role)}</small></div>${i===0?'<span class="captain-star" title="Capitão">★</span>':''}`:`<span>Vaga disponível</span>`}</div>`;}).join('')}</div></section>`;}
function draftValidation(){if(db.draft.teams.length<2)return 'Configure pelo menos 2 times.';const ids=db.draft.teams.map(t=>t.captainId);if(ids.some(id=>!id||!byId(id)))return 'Defina um capitão válido para cada time no painel do organizador.';if(new Set(ids).size!==ids.length)return 'Cada capitão só pode comandar um time.';if(db.draft.maxPlayers<2)return 'O tamanho do time deve ser pelo menos 2.';if(db.players.length<db.draft.teams.length*db.draft.maxPlayers)return `São necessários ${db.draft.teams.length*db.draft.maxPlayers} jogadores para preencher todos os times; há apenas ${db.players.length}.`;return null;}
function renderDraft(){const cur=nextTeam(),setup=db.draft.status==='setup',complete=db.draft.status==='complete',free=db.players.filter(p=>!drafted(p.id)).sort((a,b)=>a.rank-b.rank),validation=draftValidation();return `<div class="page-intro"><div><span class="eyebrow">CAPITÃES NO COMANDO</span><h1 class="heading">DRAFT <span>AO VIVO</span></h1><p class="subheading">O organizador controla as escolhas na ordem dos capitães. Cada escolha atualiza os times.</p></div><button class="btn" data-action="open-admin-draft">${ico('settings')} CONFIGURAR TIMES</button></div><section class="draft-stage"><div><small>${setup?'PRONTO PARA COMEÇAR':complete?'SELEÇÃO FINALIZADA':'CAPITÃO DA VEZ'}</small><strong>${setup?'ARENA PRONTA':complete?'DRAFT CONCLUÍDO':esc(cur?.name||'—')}</strong><p>${setup?'Confira os capitães e inicie o draft.':complete?'Todos os times foram preenchidos.':`Escolha ${db.draft.log.length+1} de ${draftMax()} · ${db.draft.snake?'Ordem snake':'Ordem circular'}`}</p></div><div class="draft-stage-controls">${setup?`<button class="btn btn-primary" data-action="start-draft" ${validation?'disabled':''}>${ico('bolt')} INICIAR DRAFT</button>`:`<button class="btn btn-ghost" data-action="undo-pick" ${!db.draft.log.length?'disabled':''}>${ico('undo')} DESFAZER</button>`}<button class="btn ${setup?'':'btn-warn'}" data-action="reset-draft">${ico('history')} REINICIAR</button><button class="btn btn-ghost" data-action="export-teams">${ico('download')} EXPORTAR</button></div></section>${setup&&validation?`<div class="notice warning">${ico('info')}${esc(validation)} <button class="btn btn-sm" data-action="open-admin-draft">Configurar</button></div>`:''}${setup?`<div class="notice">${ico('info')} Os cabeças de chave já ocupam uma vaga em seus respectivos times. O draft usa as demais vagas. Para mudar os capitães, abra “Configurar times”.</div>`:''}${complete?`<div class="notice">${ico('check')} Todas as escolhas concluídas. Exporte a lista de times ou reinicie para uma nova rodada.</div>`:''}<div class="draft-layout"><div><h2 class="section-label">${ico('users')} JOGADORES DISPONÍVEIS <span class="tag muted">${free.length}</span></h2><div class="draft-players">${free.length?free.map(renderDraftPlayer).join(''):emptyState('Elenco completo','Não há mais jogadores livres para escolher.')}</div></div><div><h2 class="section-label">${ico('shield')} TIMES EM FORMAÇÃO</h2><div class="team-grid">${db.draft.teams.map(renderTeam).join('')}</div><div class="log-panel"><strong style="font-size:12px">${ico('history')} HISTÓRICO DE ESCOLHAS</strong><div class="pick-log">${db.draft.log.length?db.draft.log.map((entry,i)=>`<div class="pick-item"><em>${String(i+1).padStart(2,'0')}</em> ${esc(byId(entry.playerId)?.nick||'—')} <span class="muted">→ ${esc(db.draft.teams.find(t=>t.id===entry.teamId)?.tag||'—')}</span></div>`).join(''):'<span class="muted" style="font-size:11px">As escolhas aparecerão aqui.</span>'}</div></div></div></div>`;}
function rankRows(){return officialRanking().filter(x=>(`${x.p.nick} ${x.p.name} ${x.p.role}`).toLowerCase().includes(ui.rankQ.toLowerCase()));}
function renderRankTable(){return rankRows().map(({p,s})=>`<tr><td><span class="rank-big">#${String(officialPosition(p.id)).padStart(2,'0')}</span></td><td><div class="table-person" data-profile="${esc(p.id)}" role="button" tabindex="0" style="cursor:pointer">${portrait(p)}<div><strong>${esc(p.nick)}</strong><small>${esc(p.name)}</small></div></div></td><td>${esc(selectedTeam(p.id)?.tag||'—')}</td><td><strong>${fmt(s.kd)}</strong></td><td>${numberOrDash(s.adr,1)}</td><td>${s.kills}</td><td>${s.deaths}</td><td>${s.assists}</td><td>${s.games}</td><td>${percentOrDash(s.winrate)}</td><td><button class="btn btn-sm btn-ghost" data-profile="${esc(p.id)}">${ico('eye')} PERFIL</button></td></tr>`).join('')||'<tr><td colspan="11">Ainda não existem estatísticas individuais de partidas oficiais. Cadastre-as no editor de partidas.</td></tr>';}
function renderRanking(){return `<div class="page-intro"><div><span class="eyebrow">APENAS DADOS DO CAMPEONATO</span><h1 class="heading">RANKING <span>DO CAMP</span></h1><p class="subheading">Organizado pelo K/D nas partidas oficiais cadastradas (desempate por ADR e abates). FACEIT, GC, Premier e históricos externos não contam. Número de mapas aparece para avaliar a amostra.</p></div>${canEdit()?`<button class="btn btn-primary" data-action="open-admin-matches">${ico('plus')} LANÇAR STATS</button>`:''}</div><div class="notice">${ico('info')} O ranking estatístico é automático. O Tier competitivo, caso adotado, continua sendo uma avaliação separada da organização.</div><div class="history-top"><label class="search-input">${ico('search')}<input id="rankingSearch" value="${esc(ui.rankQ)}" placeholder="Buscar jogador..."></label><span class="tag muted">${officialRanking().length} COM ESTATÍSTICAS</span></div><section class="ranking-wrap"><div class="table-scroll"><table class="data-table"><thead><tr><th>POS.</th><th>JOGADOR</th><th>TIME</th><th>K/D</th><th>ADR</th><th>K</th><th>D</th><th>A</th><th>MAPAS</th><th>WR</th><th></th></tr></thead><tbody id="rankingBody">${renderRankTable()}</tbody></table></div></section>`;}
function allMatches(){return db.competition.matches.slice().filter(m=>`${teamById(m.teamA)?.name||''} ${teamById(m.teamB)?.name||''} ${m.map||''} ${m.group||''}`.toLowerCase().includes(ui.historyQ.toLowerCase())).filter(m=>ui.matchFilter==='Todos'||(ui.matchFilter==='finished'?m.status==='finished':m.status==='scheduled')).sort(sortMatches);}
function historyRows(){return allMatches().map(m=>`<tr><td>${matchDate(m)}</td><td>${m.stage==='groups'?groupChip(m.group||'A'):'PLAYOFFS'}</td><td><strong>${teamLabel(m.teamA)}</strong> <span class="muted">vs</span> <strong>${teamLabel(m.teamB)}</strong></td><td>${esc(m.map||'—')}</td><td><span class="tag ${m.status==='finished'?'':'muted'}">${m.status==='finished'?'FINALIZADA':'AGENDADA'}</span></td><td><strong class="match-score">${m.status==='finished'?`${Number(m.scoreA)} : ${Number(m.scoreB)}`:'— : —'}</strong></td><td>${(m.playerStats||[]).length?`${m.playerStats.length} JOGADORES`:'—'}</td></tr>`).join('')||'<tr><td colspan="7">Nenhuma partida encontrada.</td></tr>';}
function renderHistory(){return `<div class="page-intro"><div><span class="eyebrow">RESULTADOS OFICIAIS / CAMPEONATO</span><h1 class="heading">PARTIDAS <span>DO CAMP</span></h1><p class="subheading">Jogos agendados, resultados e estatísticas individuais. Resultados da fase de grupos atualizam a tabela automaticamente.</p></div>${canEdit()?`<button class="btn btn-primary" data-action="open-admin-matches">${ico('plus')} REGISTRAR PARTIDA</button>`:''}</div><div class="history-top"><label class="search-input">${ico('search')}<input id="historySearch" value="${esc(ui.historyQ)}" placeholder="Time, mapa ou grupo..."></label><div class="competition-filter">${[['Todos','TODAS'],['scheduled','AGENDADAS'],['finished','FINALIZADAS']].map(([v,label])=>`<button class="role-btn ${ui.matchFilter===v?'active':''}" data-match-filter="${v}">${label}</button>`).join('')}</div></div><div id="historyListContent">${renderMatchCards(allMatches())}</div><div class="standings-next"><h2 class="heading">TODOS OS <span>REGISTROS</span></h2><button class="btn" data-route="standings">${ico('trophy')} VER CLASSIFICAÇÃO</button></div><div class="history-wrap"><div class="table-scroll"><table class="data-table"><thead><tr><th>DATA</th><th>FASE</th><th>CONFRONTO</th><th>MAPA</th><th>STATUS</th><th>PLACAR</th><th>STATS</th></tr></thead><tbody id="historyBody">${historyRows()}</tbody></table></div></div>`;}
let homeCarouselTimer=null,homeCarouselStart=0,homeCarouselElapsed=0,homeCarouselIndex=0,homeCarouselPaused=false,homeCarouselPointer=null;
const HOME_CAROUSEL_MS=5000;
function stopHomeCarousel(){if(homeCarouselTimer){clearInterval(homeCarouselTimer);homeCarouselTimer=null;}homeCarouselPointer=null;}
function homeNews(){return publishedNews().slice(0,4);}
function renderHomeNews(){const list=homeNews();if(!list.length)return `<section class="home-news-empty"><span class="eyebrow">JORNAL DA ARENA / ÚLTIMAS NOTÍCIAS</span><div><span class="home-news-mark">VANTA<span>.</span></span><h2>AS HISTÓRIAS DA ARENA<br><em>COMEÇAM AQUI.</em></h2><p>Em breve, novidades do campeonato e da comunidade.</p><button class="btn btn-ghost" data-route="news">VISITAR O JORNAL ${ico('arrow')}</button></div></section>`;const slides=list.map((a,i)=>`<article class="home-news-slide ${i===0?'active':''}" data-home-slide="${i}" aria-hidden="${i!==0}"><div class="home-news-photo">${photoForArticle(a,'',false)}</div><div class="home-news-shade"></div><div class="home-news-copy"><span class="news-category">${esc(a.category||'COMUNIDADE')} <i>／</i> JORNAL DA ARENA</span><h2>${esc(a.title)}</h2><p>${esc(a.summary)}</p><div class="news-meta">${articleDate(a)} · ${esc(a.author||'REDAÇÃO')}</div><button type="button" class="btn btn-primary home-news-read" data-article="${esc(a.id)}">LER NOTÍCIA ${ico('arrow')}</button></div><button type="button" class="home-news-hit" data-article="${esc(a.id)}" aria-label="Ler notícia: ${esc(a.title)}"></button></article>`).join('');return `<section class="home-news" aria-label="Notícias recentes do Jornal da Arena" data-home-carousel><div class="home-news-top"><div><span class="eyebrow">JORNAL DA ARENA / EM DESTAQUE</span><h2>ÚLTIMAS <span>NOTÍCIAS</span></h2></div><button class="home-news-all" data-route="news">VER TODAS ${ico('arrow')}</button></div><div class="home-news-viewport" tabindex="0" aria-roledescription="carrossel" aria-label="Notícias em destaque">${slides}${list.length>1?`<div class="home-news-arrows"><button type="button" data-home-step="-1" aria-label="Notícia anterior">‹</button><button type="button" data-home-step="1" aria-label="Próxima notícia">›</button></div><div class="home-news-progress" role="tablist" aria-label="Selecionar notícia">${list.map((a,i)=>`<button type="button" class="home-news-indicator ${i===0?'active':''}" data-home-goto="${i}" role="tab" aria-label="Notícia ${i+1}: ${esc(a.title)}" aria-selected="${i===0}"><span><i></i></span></button>`).join('')}</div><span class="home-news-count"><b>01</b> / ${String(list.length).padStart(2,'0')}</span>`:''}</div></section>`;}
function setupHomeCarousel(){stopHomeCarousel();const root=$('[data-home-carousel]');if(!root)return;const slides=[...root.querySelectorAll('[data-home-slide]')],indicators=[...root.querySelectorAll('[data-home-goto]')],viewport=root.querySelector('.home-news-viewport');if(slides.length<2)return;homeCarouselIndex=0;homeCarouselElapsed=0;homeCarouselPaused=false;const paint=()=>{slides.forEach((el,i)=>{el.classList.toggle('active',i===homeCarouselIndex);el.setAttribute('aria-hidden',String(i!==homeCarouselIndex));});indicators.forEach((el,i)=>{el.classList.toggle('active',i===homeCarouselIndex);el.setAttribute('aria-selected',String(i===homeCarouselIndex));});const count=root.querySelector('.home-news-count');if(count)count.innerHTML=`<b>${String(homeCarouselIndex+1).padStart(2,'0')}</b> / ${String(slides.length).padStart(2,'0')}`;root.style.setProperty('--news-progress',`${Math.min(100,homeCarouselElapsed/HOME_CAROUSEL_MS*100)}%`);};const go=(index,manual=false)=>{homeCarouselIndex=(index+slides.length)%slides.length;if(manual)homeCarouselElapsed=0;paint();};root.addEventListener('click',e=>{const step=e.target.closest('[data-home-step]'),goto=e.target.closest('[data-home-goto]');if(step)go(homeCarouselIndex+Number(step.dataset.homeStep),true);if(goto)go(Number(goto.dataset.homeGoto),true);});root.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;homeCarouselPointer={id:e.pointerId,x:e.clientX,y:e.clientY};});root.addEventListener('pointerup',e=>{if(!homeCarouselPointer||e.pointerId!==homeCarouselPointer.id)return;const dx=e.clientX-homeCarouselPointer.x,dy=e.clientY-homeCarouselPointer.y;homeCarouselPointer=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2)go(homeCarouselIndex+(dx<0?1:-1),true);});root.addEventListener('pointercancel',()=>{homeCarouselPointer=null;});root.addEventListener('keydown',e=>{if(e.target!==viewport)return;if(e.key==='ArrowRight'){e.preventDefault();go(homeCarouselIndex+1,true);}if(e.key==='ArrowLeft'){e.preventDefault();go(homeCarouselIndex-1,true);}});const pause=()=>{homeCarouselPaused=true;};const resume=()=>{homeCarouselPaused=false;};root.addEventListener('mouseenter',pause);root.addEventListener('mouseleave',resume);root.addEventListener('focusin',pause);root.addEventListener('focusout',e=>{if(!root.contains(e.relatedTarget))resume();});root.addEventListener('touchstart',pause,{passive:true});root.addEventListener('touchend',resume,{passive:true});homeCarouselTimer=setInterval(()=>{if(homeCarouselPaused)return;homeCarouselElapsed+=80;if(homeCarouselElapsed>=HOME_CAROUSEL_MS){homeCarouselElapsed=0;go(homeCarouselIndex+1);}else paint();},80);paint();}
function photoForArticle(a,cls='',showPlaceholderLabels=true){return a.imageUrl&&safeSrc(a.imageUrl)?`<img class="${cls}" src="${esc(a.imageUrl)}" alt="Capa da matéria: ${esc(a.title)}" loading="lazy">`:`<div class="news-placeholder ${cls}" aria-hidden="true">${showPlaceholderLabels?'<span>VANTA<span class="lime">/</span></span><strong>PRESS</strong><small>CS2 • CAMPEONATO</small>':''}</div>`;}
function newsCard(a,i){return `<article class="news-card" data-article="${esc(a.id)}" role="button" tabindex="0"><div class="news-card-media">${photoForArticle(a)}</div><div class="news-card-copy"><span class="news-category">${esc(a.category||'COMUNIDADE')}</span><h3>${esc(a.title)}</h3><p>${esc(a.summary)}</p><div class="news-meta"><span>${articleDate(a)} · ${esc(a.author||'REDAÇÃO')}</span><span>LER MATÉRIA ↗</span></div></div></article>`;}
function renderNews(){const list=publishedNews(),feature=list[0];return `<section class="newspaper-head"><div><span class="eyebrow">O LADO B DO CAMPEONATO</span><h1 class="paper-masthead">JORNAL <em>DA ARENA<span>.</span></em></h1><p>Clutches, bastidores, rivalidades saudáveis e as melhores resenhas do servidor.</p></div><div class="paper-stamp"><strong>VANTA</strong><small>EDIÇÃO DIGITAL</small><span>EST. 2026</span></div></section><div class="paper-ticker"><span>ÚLTIMAS DO SERVIDOR</span><p>Notícias, avisos oficiais e histórias da comunidade. Sem fake news e com muito CS.</p></div>${feature?`<section class="news-feature" data-article="${esc(feature.id)}" role="button" tabindex="0"><div class="news-feature-image">${photoForArticle(feature)}</div><div class="news-feature-copy"><span class="news-category">DESTAQUE / ${esc(feature.category)}</span><h2>${esc(feature.title)}</h2><p>${esc(feature.summary)}</p><div class="news-meta">${articleDate(feature)} · ${esc(feature.author||'REDAÇÃO')}</div><span class="read-link">CONTINUAR LENDO →</span></div></section>`:emptyState('A redação está preparando a primeira edição','Nenhuma matéria publicada ainda.')}<div class="news-section-head"><div><span class="eyebrow">ARQUIVO DA REDAÇÃO</span><h2 class="heading">ÚLTIMAS <span>MATÉRIAS</span></h2></div>${canEdit()?`<button class="btn btn-primary" data-action="open-admin-news">${ico('plus')} NOVA MATÉRIA</button>`:''}</div><section class="news-grid">${list.slice(1).map(newsCard).join('')||'<p class="subheading">Novas histórias em breve.</p>'}</section>`;}

function submitTeamsForm(form){if(!canEdit())return;const fd=new FormData(form),count=clamp(fd.get('teamCount'),1,32),max=clamp(fd.get('maxPlayers'),2,10),existing=db.draft.teams;const removed=existing.slice(count);if(db.competition.matches.some(m=>removed.some(t=>t.id===m.teamA||t.id===m.teamB)))return toast('Não é possível remover um time que já possui partidas. Exclua os confrontos antes.',true);const newTeams=Array.from({length:count},(_,i)=>{const old=existing[i]||{},ids=Array.from({length:max},(_,j)=>String(fd.get(`slot_${i}_${j}`)||'')).map(x=>byId(x)?x:'');return {id:old.id||uid(),name:String(fd.get(`teamName_${i}`)||old.name||`TIME ${i+1}`).trim().slice(0,36),tag:String(fd.get(`teamTag_${i}`)||old.tag||`T${i+1}`).trim().toUpperCase().slice(0,4),group:String(fd.get(`teamGroup_${i}`)||old.group||'A').trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,3)||'A',color:old.color||['#c0fb5b','#62e1d2','#ffa15e','#bd91ff','#edda70','#78bcff'][i%6],captainId:ids[0]||'',members:ids.slice(1).filter(Boolean)};});const all=newTeams.flatMap(t=>[t.captainId,...t.members]).filter(Boolean);if(new Set(all).size!==all.length)return toast('Um jogador não pode aparecer em dois times ou posições.',true);if(db.competition.matches.some(m=>m.stage==='groups'&&m.status==='finished'&&newTeams.some(t=>(t.id===m.teamA||t.id===m.teamB)&&t.group!==m.group)))return toast('Um time com resultado finalizado não pode mudar de grupo. Edite ou exclua a partida antes.',true);db.draft.maxPlayers=max;db.draft.teams=newTeams;db.draft.log=newTeams.flatMap(t=>t.members.map(playerId=>({teamId:t.id,playerId,at:new Date().toISOString()})));db.draft.status='complete';db.eventName=String(fd.get('eventName')||db.eventName).trim().slice(0,44)||db.eventName;save();render();toast('Elencos e grupos salvos!');}
function matchStatsFields(teamId,existing){const team=teamById(teamId);if(!team)return '';const roster=rosterOf(team);if(!roster.length)return `<p class="field-help">${esc(team.name)} ainda não possui jogadores cadastrados.</p>`;return `<section class="match-player-team"><h4>${esc(team.name)} <span>${esc(team.tag)}</span></h4><div class="match-player-head"><span>JOGADOR</span><span>KILLS</span><span>DEATHS</span><span>ASSISTS</span><span>ADR</span><span>HS</span></div>${roster.map(player=>{const st=(existing?.playerStats||[]).find(x=>x.playerId===player.id)||{};return `<div class="match-player-inputs"><strong>${esc(player.nick)}</strong>${[['kills',st.kills],['deaths',st.deaths],['assists',st.assists],['adr',st.adr],['headshots',st.headshots]].map(([k,v])=>`<input type="number" min="0" max="${k==='adr'?400:200}" step="${k==='adr'?'0.1':'1'}" name="ps_${esc(player.id)}_${k}" value="${v===undefined||v===null?'':esc(v)}" placeholder="—" aria-label="${esc(k)} de ${esc(player.nick)}">`).join('')}</div>`;}).join('')}</section>`;}

 if(existing)Object.assign(existing,record);else db.competition.matches.push(record);ui.editingMatchId=record.id;save();render();toast('Partida salva! Tabela e ranking atualizados automaticamente.');

const ROUTE_HASH={players:'inicio',news:'jornal',teams:'times',standings:'tabela',ranking:'ranking',history:'partidas'};
function route(name){if(!['players','news','teams','standings','ranking','history'].includes(name))return;ui.route=name;ui.modal=null;$('#modalRoot').innerHTML='';$('#sidebar').classList.remove('mobile-open');render();if(location.hash.slice(1)!==ROUTE_HASH[name])location.hash=ROUTE_HASH[name];window.scrollTo({top:0,behavior:'instant'});}
function parseMatches(v){return String(v||'').split('\n').map(line=>line.trim()).filter(Boolean).map(line=>{const [date,map,result,kda,opponent,score]=line.split('|').map(s=>s?.trim()||'');const[k,d,a]=(kda||'').split('/').map(x=>clamp(x,0,100));return {date:date||'',map:map||'',result:/^[vVwW]/.test(result)?'V':'D',kills:k,deaths:d,assists:a,opponent:opponent||'',score:score||''};});}
function printMatches(matches){return (matches||[]).map(m=>`${m.date||''} | ${m.map||''} | ${m.result||'V'} | ${m.kills||0}/${m.deaths||0}/${m.assists||0} | ${m.opponent||''} | ${m.score||''}`).join('\n');}
function openProfile(id){if(!byId(id))return;ui.playerId=id;ui.route='profile';ui.modal=null;$('#modalRoot').innerHTML='';render();if(location.hash.slice(1)!==`jogador/${encodeURIComponent(id)}`)location.hash=`jogador/${encodeURIComponent(id)}`;window.scrollTo({top:0,behavior:'instant'});}
function openAdmin(tab='players',editId=ui.editingId){if(cloudConfigured&&!canEdit()){ui.modal={type:'login'};renderModal();return;}ui.modal={type:'admin'};ui.adminTab=tab;ui.editingId=editId||'new';ui.pendingPhoto=undefined;renderModal();}
function closeModal(){ui.modal=null;$('#modalRoot').innerHTML='';}
function renderModal(){let html=ui.modal?.type==='admin'?renderAdmin():ui.modal?.type==='login'?renderLogin():'';$('#modalRoot').innerHTML=html;}
function profileContent(p){const t=selectedTeam(p.id),s=officialStats(p.id),pos=officialPosition(p.id);const history=playedMatches().filter(m=>(m.playerStats||[]).some(x=>x.playerId===p.id)).sort(sortMatches);return `<div class="profile-hero"><div class="profile-portrait">${portrait(p)}</div><div class="profile-head"><span class="eyebrow">PERFIL DO JOGADOR</span><h2>${esc(p.nick)}</h2><p>${esc(p.flag)} ${esc(p.name)}</p><div class="profile-pills"><span class="tag">${esc(p.role)}</span><span class="tag muted">${t?esc(t.name):'SEM TIME'}</span></div><div class="profile-rank">${pos===null?'AINDA SEM RANKING DO CAMP':`#${String(pos).padStart(2,'0')} NO CAMPEONATO`}</div></div></div><div class="profile-body"><h3 class="profile-section-title">ESTATÍSTICAS OFICIAIS DO CAMPEONATO</h3><div class="profile-grid"><div class="profile-stat"><small>K/D CAMP</small><strong>${numberOrDash(s.kd,2)}</strong></div><div class="profile-stat"><small>MAPAS</small><strong>${s.games}</strong></div><div class="profile-stat"><small>ABATES</small><strong>${s.kills}</strong></div><div class="profile-stat"><small>MORTES</small><strong>${s.deaths}</strong></div><div class="profile-stat"><small>ASSISTÊNCIAS</small><strong>${s.assists}</strong></div><div class="profile-stat"><small>ADR CAMP</small><strong>${numberOrDash(s.adr,1)}</strong></div><div class="profile-stat"><small>HS%</small><strong>${percentOrDash(s.hs)}</strong></div><div class="profile-stat"><small>WIN RATE CAMP</small><strong>${percentOrDash(s.winrate)}</strong></div></div><section class="profile-section"><h3>DADOS DE PLATAFORMAS (REFERÊNCIA EXTERNA)</h3><p>Não são usados no ranking oficial do campeonato.</p><div class="external-pill-row"><span>FACEIT <strong>${compact(p.faceit)}</strong></span><span>GC <strong>${compact(p.gc)}</strong></span><span>PREMIER <strong>${compact(p.premier)}</strong></span></div></section><section class="profile-section"><h3>SCOUTING REPORT</h3><p>${esc(p.bio||'Nenhuma descrição cadastrada.')}</p></section><section class="profile-section"><h3>PARTIDAS DO CAMPEONATO</h3><div class="profile-history">${history.length?history.map(m=>{const st=(m.playerStats||[]).find(x=>x.playerId===p.id);return `<div class="profile-match"><span class="date">${matchDate(m)}</span><strong>${esc(m.map||'—')}</strong><span>${teamLabel(m.teamA)} x ${teamLabel(m.teamB)}</span><span>${Number(m.scoreA)}:${Number(m.scoreB)}</span><span>${st.kills}/${st.deaths}/${st.assists}</span></div>`;}).join(''):'<p>Este jogador ainda não tem estatísticas cadastradas em partidas oficiais.</p>'}</div></section><div class="profile-actions">${canEdit()?`<button class="btn" data-action="edit-player" data-id="${esc(p.id)}">${ico('settings')} EDITAR PERFIL</button>`:''}<button class="btn btn-ghost" data-route="players">${ico('arrow')} VOLTAR AO ELENCO</button></div></div>`;}
function renderProfilePage(p){if(!p)return emptyState('Jogador não encontrado','Volte ao elenco para consultar os participantes.');return `<div class="page-intro"><div><span class="eyebrow">INTELIGÊNCIA DE JOGO / SCOUTING</span><h1 class="heading">PLAYER <span>PROFILE</span></h1><p class="subheading">Dados oficiais do campeonato e informações externas do participante, claramente separadas.</p></div><button class="btn btn-ghost" data-route="players">← TODOS OS JOGADORES</button></div><section class="profile-standalone" aria-label="Perfil do jogador ${esc(p.nick)}">${profileContent(p)}</section>`;}
function renderAdmin(){const tabs=[['players','JOGADORES'],['news','REDAÇÃO / JORNAL'],['teams','TIMES'],['matches','PARTIDAS'],['data','DADOS'],['account','ACESSO']];return `<div class="modal-overlay" data-close-overlay="1"><article class="modal admin-modal" role="dialog" aria-modal="true" aria-label="Painel administrativo"><button class="modal-close" aria-label="Fechar" data-action="close-modal">${ico('close')}</button><header class="admin-header"><span class="eyebrow">${cloudConfigured?'ÁREA RESTRITA':'MODO DEMONSTRAÇÃO LOCAL'}</span><h2>PAINEL ADMINISTRATIVO</h2><p>Cadastre jogadores e times, registre confrontos com placar e estatísticas, publique o jornal. ${cloudConfigured?'Dados compartilhados entre os editores autorizados.':'Sem nuvem: alterações ficam neste navegador; o painel não tem autenticação real.'}</p></header><div class="admin-tabs">${tabs.map(([id,name])=>`<button class="admin-tab ${ui.adminTab===id?'active':''}" data-admin-tab="${id}">${name}</button>`).join('')}</div><div class="admin-content">${ui.adminTab==='players'?renderAdminPlayers():ui.adminTab==='news'?renderAdminNews():ui.adminTab==='teams'?renderAdminTeams():ui.adminTab==='matches'?renderAdminMatches():ui.adminTab==='account'?renderAdminAccount():renderAdminData()}</div></article></div>`;}
function renderAdminPlayers(){const p=byId(ui.editingId),newP=!p;const all=db.players.slice().sort((a,b)=>a.rank-b.rank);return `<div class="admin-players"><aside><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b style="font-size:12px">ATLETAS (${db.players.length})</b><button class="btn btn-primary btn-sm" data-action="add-player">${ico('plus')} NOVO</button></div><div class="admin-list">${all.map(player=>`<button class="admin-list-item ${p?.id===player.id?'active':''}" data-admin-edit="${esc(player.id)}">${portrait(player)}<span><strong>${esc(player.nick)}</strong><small>Ordem ${player.rank} · ${esc(player.role)}</small></span></button>`).join('')}</div></aside><div><form id="playerForm"><div class="form-grid"><div class="form-section-name">${newP?'CADASTRAR JOGADOR':'EDITAR '+esc(p.nick)}</div><div class="field"><label for="fNick">Nick *</label><input id="fNick" name="nick" required maxlength="30" value="${esc(p?.nick||'')}" placeholder="Ex: KRYPT"></div><div class="field"><label for="fName">Nome completo</label><input id="fName" name="name" maxlength="65" value="${esc(p?.name||'')}" placeholder="Nome do jogador"></div><div class="field"><label for="fFlag">País / Bandeira (emoji)</label><input id="fFlag" name="flag" maxlength="12" value="${esc(p?.flag||'🇧🇷')}" placeholder="🇧🇷"></div><div class="field"><label for="fRole">Função in-game</label><select name="role" id="fRole">${ROLES.map(r=>`<option value="${esc(r)}" ${r===(p?.role||ROLES[0])?'selected':''}>${esc(r)}</option>`).join('')}</select></div><div class="field"><label for="fRank">Ordem interna (não conta no ranking oficial)</label><input id="fRank" type="number" name="rank" min="1" max="9999" value="${p?.rank||db.players.length+1}" required></div><div class="field"><label for="fKD">K/D externo (referência)</label><input id="fKD" type="number" step=".01" min="0" max="20" name="kd" value="${p?.kd??1.00}"></div><div class="field"><label for="fGC">Gamers Club · nível</label><input id="fGC" type="number" min="0" max="30" name="gc" value="${p?.gc??10}"></div><div class="field"><label for="fFaceit">FACEIT · nível</label><input id="fFaceit" type="number" min="0" max="10" name="faceit" value="${p?.faceit??5}"></div><div class="field"><label for="fPremier">Premier · pontos</label><input id="fPremier" type="number" min="0" max="100000" name="premier" value="${p?.premier??10000}"></div><div class="field"><label for="fADR">ADR externo (referência)</label><input id="fADR" type="number" min="0" max="300" step=".1" name="adr" value="${p?.adr??70}"></div><div class="field"><label for="fHS">Headshots (%)</label><input id="fHS" type="number" min="0" max="100" step=".1" name="hs" value="${p?.hs??45}"></div><div class="field"><label for="fWinrate">Win rate externo (%)</label><input id="fWinrate" type="number" min="0" max="100" step=".1" name="winrate" value="${p?.winrate??50}"></div><div class="field"><label for="fGames">Partidas externas (referência)</label><input id="fGames" type="number" min="0" max="999999" name="games" value="${p?.games??0}"></div><div class="field span2"><label for="fPhoto">URL de foto (opcional)</label><input id="fPhoto" name="photoUrl" type="url" value="${p?.image?.startsWith('http')?esc(p.image):''}" placeholder="https://.../foto.png"></div><div class="field full"><label for="photoUpload">Ou enviar foto do computador (JPG / PNG)</label><input id="photoUpload" type="file" accept="image/png,image/jpeg,image/webp"><p id="uploadState" class="field-help">${ui.pendingPhoto?'✓ Imagem preparada':p?.image?'Foto cadastrada; o envio substitui a imagem atual.':'Sem foto? O site gera automaticamente um avatar ilustrado.'}</p></div><div class="field full"><label for="fBio">Observações / scouting</label><textarea id="fBio" name="bio" rows="2" maxlength="700">${esc(p?.bio||'')}</textarea></div><div class="field full"><p class="field-help">As estatísticas do campeonato são lançadas exclusivamente em PARTIDAS, vinculadas aos times e ao resultado oficial. Dados externos não alteram o ranking do camp.</p></div></div><div class="form-actions">${p?`<button type="button" class="btn btn-warn" data-action="delete-player" data-id="${esc(p.id)}">${ico('trash')} EXCLUIR</button>`:''}<button type="submit" class="btn btn-primary">${ico('check')} ${newP?'CADASTRAR JOGADOR':'SALVAR ALTERAÇÕES'}</button></div></form></div></div>`;}
function renderAdminDraft(){const d=db.draft,locked=d.status!=='setup';return `<div class="notice ${locked?'warning':''}">${ico('info')}${locked?'O draft já começou. Reinicie-o antes de editar capitães, número de equipes ou tamanho dos times.':'Defina os cabeças de chave e a ordem de escolha. Cada capitão ocupa a primeira vaga do próprio time.'}</div><form id="draftConfigForm"><div class="form-grid"><div class="field full"><label>Nome do campeonato</label><input name="eventName" maxlength="44" value="${esc(db.eventName)}" ${locked?'disabled':''} placeholder="CS2 COMMUNITY CUP"></div><div class="field"><label>Quantidade de times</label><select name="teamCount" ${locked?'disabled':''}>${[2,3,4,5,6,7,8].map(n=>`<option value="${n}" ${n===d.teams.length?'selected':''}>${n} times</option>`).join('')}</select></div><div class="field"><label>Jogadores por time</label><select name="maxPlayers" ${locked?'disabled':''}>${[2,3,4,5,6,7,8,9,10].map(n=>`<option value="${n}" ${n===d.maxPlayers?'selected':''}>${n} jogadores</option>`).join('')}</select></div><div class="field"><label>Ordem de escolha</label><select name="snake" ${locked?'disabled':''}><option value="true" ${d.snake?'selected':''}>Snake (ida e volta)</option><option value="false" ${!d.snake?'selected':''}>Circular (1 → N)</option></select></div></div><div class="config-teams">${d.teams.map((t,i)=>`<section class="config-team"><h4 style="color:${esc(t.color)}">TIME ${String(i+1).padStart(2,'0')}</h4><div class="field"><label>Nome do time</label><input name="teamName_${i}" maxlength="36" value="${esc(t.name)}" ${locked?'disabled':''} required></div><div class="field"><label>Tag (até 4 letras)</label><input name="teamTag_${i}" maxlength="4" value="${esc(t.tag)}" ${locked?'disabled':''} required></div><div class="field"><label>Cabeça de chave / Capitão</label><select name="captain_${i}" ${locked?'disabled':''}><option value="">Selecione um jogador</option>${db.players.slice().sort((a,b)=>a.rank-b.rank).map(p=>`<option value="${esc(p.id)}" ${t.captainId===p.id?'selected':''}>#${p.rank} — ${esc(p.nick)}</option>`).join('')}</select></div></section>`).join('')}</div>${!locked?`<button type="submit" class="btn btn-primary">${ico('check')} SALVAR CONFIGURAÇÃO</button>`:`<button type="button" class="btn btn-warn" data-action="reset-draft">${ico('history')} REINICIAR DRAFT</button>`}</form><p class="field-help" style="margin-top:17px">Para aumentar ou reduzir a quantidade de times, selecione o número desejado e salve. Novos times receberão nomes e cores automáticos, e você poderá escolher seus capitães depois.</p>`;}
function renderAdminData(){return `<div class="settings-note">${ico('info')} <strong>Importante:</strong> no modo local, os dados ficam neste navegador. Com o Supabase configurado, editores autorizados sincronizam as alterações.</div><div style="height:15px"></div><div class="data-zone"><div><h4>FAZER BACKUP COMPLETO</h4><p>Exporta jogadores, times, grupos, todas as partidas e estatísticas oficiais em JSON.</p></div><button class="btn btn-primary" data-action="export-json">${ico('download')} BAIXAR JSON</button></div><div class="data-zone"><div><h4>RESTAURAR DADOS</h4><p>Importe um backup JSON exportado deste sistema. Substitui os dados atuais.</p></div><label for="jsonUpload" class="btn">${ico('upload')} IMPORTAR JSON</label><input type="file" id="jsonUpload" accept=".json,application/json"></div><div class="data-zone"><div><h4>EXPORTAR TIMES</h4><p>Gera um arquivo CSV dos elencos registrados, que pode ser aberto no Excel.</p></div><button class="btn" data-action="export-teams">${ico('download')} TIMES CSV</button></div><div class="data-zone"><div><h4>RESTAURAR DEMONSTRAÇÃO</h4><p>Apaga jogadores, times, grupos e partidas do navegador e recria o exemplo.</p></div>${cloudConfigured?'':`<button class="btn btn-warn" data-action="reset-all">${ico('trash')} RESTAURAR EXEMPLO</button>`}</div>`;}
function choosePlayer(id){if(db.draft.status!=='live'){toast('Inicie o draft antes de escolher jogadores.',true);return;}if(drafted(id)){toast('Este jogador já foi escolhido ou é capitão.',true);return;}const team=nextTeam(),p=byId(id);if(!team||!p)return;if(rosterOf(team).length>=db.draft.maxPlayers){toast('Este time já está completo.',true);return;}db.draft.log.push({teamId:team.id,playerId:id,at:new Date().toISOString()});if(isDraftDone())db.draft.status='complete';save();closeModal();if(ui.route==='profile')route('draft');else render();toast(`${p.nick} entrou no ${team.name}!`);}
function startDraft(){const error=draftValidation();if(error){toast(error,true);return;}db.draft.status='live';save();render();toast('Draft iniciado. Boa sorte aos capitães!');}
function undo(){if(!db.draft.log.length)return;db.draft.log.pop();db.draft.status='live';save();render();toast('Última escolha desfeita.');}
function resetDraft(){if(!confirm('Reiniciar o draft? Todas as escolhas serão apagadas (capitães e jogadores permanecerão cadastrados).'))return;db.draft.log=[];db.draft.status='setup';save();render();toast('Draft reiniciado.');}
function submitPlayer(form){if(!canEdit())return toast('Acesso de editor necessário.',true);const f=new FormData(form),existing=byId(ui.editingId),nick=String(f.get('nick')||'').trim();if(!nick){toast('Informe o nick.',true);return;}const url=String(f.get('photoUrl')||'').trim();if(url&&!safeSrc(url)){toast('A URL da foto deve começar com http:// ou https://.',true);return;}const p={id:existing?.id||uid(),nick:nick.slice(0,30),name:String(f.get('name')||'').trim().slice(0,65),flag:String(f.get('flag')||'🇧🇷').trim().slice(0,12),role:ROLES.includes(f.get('role'))?f.get('role'):ROLES[0],rank:clamp(f.get('rank'),1,9999),kd:clamp(f.get('kd'),0,20),gc:clamp(f.get('gc'),0,30),faceit:clamp(f.get('faceit'),0,10),premier:clamp(f.get('premier'),0,100000),adr:clamp(f.get('adr'),0,300),hs:clamp(f.get('hs'),0,100),winrate:clamp(f.get('winrate'),0,100),games:clamp(f.get('games'),0,999999),image:ui.pendingPhoto??(url||existing?.image||''),bio:String(f.get('bio')||'').slice(0,700),matches:parseMatches(f.get('matchHistory'))};
 if(existing)Object.assign(existing,p);else db.players.push(p);save();ui.editingId=p.id;ui.pendingPhoto=undefined;render();toast(existing?'Perfil atualizado.':'Jogador cadastrado!');}
function deletePlayer(id){if(!canEdit())return toast('Acesso de editor necessário.',true);const p=byId(id);if(!p)return;if(db.competition.matches.some(m=>(m.playerStats||[]).some(st=>st.playerId===id))){toast('Jogador com estatísticas oficiais: remova os registros das partidas antes de excluir.',true);return;}if(drafted(id)){toast('Não é possível excluir um capitão ou jogador já escolhido. Reinicie o draft e remova o capitão antes.',true);return;}if(!confirm(`Excluir ${p.nick} do campeonato?`))return;db.players=db.players.filter(x=>x.id!==id);ui.editingId=db.players[0]?.id||'new';save();render();toast('Jogador excluído.');}
function submitDraftConfig(form){if(db.draft.status!=='setup')return;const f=new FormData(form),n=clamp(f.get('teamCount'),2,32),maxPlayers=clamp(f.get('maxPlayers'),2,10);let teams=Array.from({length:n},(_,i)=>{const old=db.draft.teams[i]||{},base=['#c0fb5b','#5ce2db','#ffb46c','#bd91ff','#ff8792','#78bcff','#edda70','#8be3a3'];return {id:old.id||`team${i+1}`,name:String(f.get(`teamName_${i}`)||old.name||`TEAM ${i+1}`).trim().slice(0,36),tag:String(f.get(`teamTag_${i}`)||old.tag||`T${i+1}`).trim().toUpperCase().slice(0,4),color:old.color||base[i],captainId:String(f.get(`captain_${i}`)??old.captainId??'')};});
 const ids=teams.map(t=>t.captainId).filter(Boolean);if(new Set(ids).size!==ids.length){toast('Um jogador não pode ser capitão de dois times.',true);return;}db.eventName=String(f.get('eventName')||db.eventName).trim().slice(0,44)||'CS2 COMMUNITY CUP';db.draft.teams=teams;db.draft.maxPlayers=maxPlayers;db.draft.snake=f.get('snake')!=='false';save();render();toast('Configuração de times salva.');}
function download(name,mime,content){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([content],{type:mime}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function exportTeams(){const rows=[['TIME','GRUPO','CAPITÃO','POSIÇÃO NO TIME','JOGADOR','FUNÇÃO','POSIÇÃO CAMP','MAPAS CAMP','K/D CAMP','ADR CAMP','FACEIT EXT','GC EXT','PREMIER EXT'],...db.draft.teams.flatMap(t=>rosterOf(t).map((p,i)=>{const st=officialStats(p.id);return [t.name,t.group||'A',byId(t.captainId)?.nick||'',i+1,p.nick,p.role,officialPosition(p.id)||'',st.games,st.kd===null?'':fmt(st.kd),st.adr===null?'':fmt(st.adr,1),p.faceit,p.gc,p.premier];}))];const csv='\uFEFF'+rows.map(row=>row.map(val=>'"'+String(val).replace(/"/g,'""')+'"').join(';')).join('\r\n');download('vanta-times-cs2.csv','text/csv;charset=utf-8',csv);toast('Planilha de times exportada.');}
function exportJSON(){download('vanta-backup-cs2.json','application/json;charset=utf-8',JSON.stringify(db,null,2));toast('Backup JSON exportado.');}
async function resizePhoto(file){if(!file||!file.type.startsWith('image/'))throw new Error('Envie um arquivo de imagem JPG, PNG ou WEBP.');if(file.size>15*1024*1024)throw new Error('Imagem muito grande: limite de 15 MB.');const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=dataUrl;});let scale=Math.min(520/img.width,650/img.height,1),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.74);}
async function importJSON(file){if(!canEdit())return toast('Acesso de editor necessário.',true);try{const raw=JSON.parse(await file.text());if(!Array.isArray(raw.players)||!Array.isArray(raw.draft?.teams)||!Array.isArray(raw.draft?.log))throw new Error('O JSON não possui a estrutura de backup esperada.');if(!confirm('Importar este backup? Os dados atuais serão substituídos.'))return;const cleanPlayers=raw.players.filter(p=>p&&typeof p.id==='string'&&typeof p.nick==='string').slice(0,500).map(p=>({...p,image:safeSrc(p.image)?p.image:'',matches:Array.isArray(p.matches)?p.matches:[]}));if(!cleanPlayers.length)throw new Error('Backup sem jogadores válidos.');db={eventName:String(raw.eventName||'CS2 COMMUNITY CUP').slice(0,44),players:cleanPlayers,draft:{teams:raw.draft.teams.filter(t=>t&&typeof t.id==='string').slice(0,32),log:raw.draft.log.filter(x=>x&&typeof x.playerId==='string'&&typeof x.teamId==='string'),maxPlayers:clamp(raw.draft.maxPlayers,2,10),snake:!!raw.draft.snake,status:['setup','live','complete'].includes(raw.draft.status)?raw.draft.status:'setup'},competition:{matches:Array.isArray(raw.competition?.matches)?raw.competition.matches.filter(m=>m&&typeof m.id==='string'&&typeof m.teamA==='string'&&typeof m.teamB==='string').slice(0,1000):[]}};normalizeCompetition(db);save();ui.editingId=db.players[0]?.id||'new';closeModal();render();toast('Backup importado com sucesso.');}catch(e){toast(e.message||'Falha ao importar o JSON.',true);}}
function dispatchAction(name,el){switch(name){case'close-modal':closeModal();break;case'open-admin-draft':openAdmin('teams');break;case'open-admin-players':openAdmin('players');break;case'open-admin-news':openAdmin('news');ui.editingArticleId=null;renderModal();break;case'open-admin-teams':openAdmin('teams');break;case'open-admin-matches':openAdmin('matches');break;case'new-match':ui.editingMatchId=null;renderModal();break;case'delete-match':deleteMatch(el.dataset.id);break;case'add-team':if(!canEdit())break;if(db.draft.teams.length>=32){toast('Limite de 32 times.',true);break;}db.draft.teams.push({id:uid(),name:'NOVO TIME '+(db.draft.teams.length+1),tag:'T'+(db.draft.teams.length+1),group:'A',color:['#c0fb5b','#62e1d2','#ffa15e','#bd91ff'][db.draft.teams.length%4],captainId:'',members:[]});save();render();toast('Novo time adicionado. Edite o nome, grupo e elenco e salve.');break;case'new-article':ui.editingArticleId=null;renderModal();break;case'edit-article':openAdmin('news');ui.editingArticleId=el.dataset.id;renderModal();break;case'delete-article':deleteArticle(el.dataset.id);break;case'logout':expireAdminSession('logout').then(()=>toast('Sessão encerrada.'));break;case'edit-player':openAdmin('players',el.dataset.id);break;case'add-player':ui.editingId='new';ui.pendingPhoto=undefined;renderModal();break;case'delete-player':deletePlayer(el.dataset.id);break;case'start-draft':startDraft();break;case'undo-pick':undo();break;case'reset-draft':resetDraft();break;case'export-teams':exportTeams();break;case'export-json':exportJSON();break;case'reset-all':if(!cloudConfigured&&confirm('Restaurar todos os dados de demonstração? Você perderá os dados cadastrados.')){db=normalizeCompetition(createDemo());save();ui.editingId=db.players[0]?.id||'new';closeModal();render();toast('Exemplo restaurado.');}break;}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-route],[data-profile],[data-pick],[data-role],[data-admin-tab],[data-admin-edit],[data-admin-article],[data-article],[data-group],[data-match-filter],[data-edit-match]');if(el){if(el.dataset.route){route(el.dataset.route);return;}if(el.dataset.action){dispatchAction(el.dataset.action,el);return;}if(el.dataset.group){ui.tableGroup=el.dataset.group;render();return;}if(el.dataset.matchFilter){ui.matchFilter=el.dataset.matchFilter;render();return;}if(el.dataset.editMatch){ui.editingMatchId=el.dataset.editMatch;renderModal();return;}if(el.dataset.pick){choosePlayer(el.dataset.pick);return;}if(el.dataset.profile){openProfile(el.dataset.profile);return;}if(el.dataset.article){openArticle(el.dataset.article);return;}if(el.dataset.adminArticle){ui.editingArticleId=el.dataset.adminArticle;renderModal();return;}if(el.dataset.role){ui.role=el.dataset.role;render();return;}if(el.dataset.adminTab){ui.adminTab=el.dataset.adminTab;ui.pendingPhoto=undefined;renderModal();return;}if(el.dataset.adminEdit){ui.editingId=el.dataset.adminEdit;ui.pendingPhoto=undefined;renderModal();return;}}if(e.target.matches('[data-close-overlay]'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ui.modal)closeModal();else $('#sidebar').classList.remove('mobile-open');}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-profile][role="button"],.player-card[role="button"],[data-article][role="button"]')){e.preventDefault();if(e.target.dataset.article)openArticle(e.target.dataset.article);else openProfile(e.target.dataset.profile);}});
document.addEventListener('input',e=>{if(e.target.id==='rosterSearch'){ui.q=e.target.value;refreshRoster();}if(e.target.id==='rankingSearch'){ui.rankQ=e.target.value;$('#rankingBody').innerHTML=renderRankTable();}if(e.target.id==='historySearch'){ui.historyQ=e.target.value;const box=$('#historyListContent');if(box)box.innerHTML=renderMatchCards(allMatches());$('#historyBody').innerHTML=historyRows();}});
document.addEventListener('change',async e=>{if(e.target.id==='rosterSort'){ui.sort=e.target.value;refreshRoster();}if(e.target.id==='matchTeamA'||e.target.id==='matchTeamB')updateMatchPlayerFields();if(e.target.id==='photoUpload'&&e.target.files?.[0]){const label=$('#uploadState');if(label)label.textContent='Preparando imagem...';try{ui.pendingPhoto=await resizePhoto(e.target.files[0]);if(label)label.textContent='✓ Foto pronta para salvar. (Redimensionada automaticamente.)';toast('Foto preparada para o jogador.');}catch(err){ui.pendingPhoto=undefined;toast(err.message,true);if(label)label.textContent='Erro ao processar a foto.';}}if(e.target.id==='jsonUpload'&&e.target.files?.[0])await importJSON(e.target.files[0]);});
document.addEventListener('submit',e=>{if(e.target.id==='playerForm'){e.preventDefault();submitPlayer(e.target);}if(e.target.id==='draftConfigForm'){e.preventDefault();submitDraftConfig(e.target);}if(e.target.id==='articleForm'){e.preventDefault();submitNewsForm(e.target);}if(e.target.id==='teamsForm'){e.preventDefault();submitTeamsForm(e.target);}if(e.target.id==='matchForm'){e.preventDefault();submitMatch(e.target);}if(e.target.id==='loginForm'){e.preventDefault();submitLogin(e.target);}});
$('#mobileMenu').addEventListener('click',()=>$('#sidebar').classList.toggle('mobile-open'));
$('#adminTop').addEventListener('click',()=>openAdmin('players'));
$('#adminShortcut').addEventListener('click',()=>openAdmin('players'));
window.addEventListener('hashchange',()=>{const h=decodeURIComponent(location.hash.slice(1));if(h.startsWith('noticia/')){const id=h.slice(8);if(articleById(id)&&(ui.route!=='article'||ui.articleId!==id)){ui.articleId=id;ui.route='article';render();}}else if(h.startsWith('jogador/')){const id=h.slice(8);if(byId(id)&&(ui.route!=='profile'||ui.playerId!==id)){ui.playerId=id;ui.route='profile';render();}}else{const found=h==='jogadores'?'players':Object.keys(ROUTE_HASH).find(k=>ROUTE_HASH[k]===h);if(found&&ui.route!==found){ui.route=found;render();}}});
const initial=decodeURIComponent(location.hash.slice(1));if(initial.startsWith('noticia/')&&articleById(initial.slice(8))){ui.route='article';ui.articleId=initial.slice(8);}else if(initial.startsWith('jogador/')&&byId(initial.slice(8))){ui.route='profile';ui.playerId=initial.slice(8);}else{const found=initial==='jogadores'?'players':Object.keys(ROUTE_HASH).find(k=>ROUTE_HASH[k]===initial);if(found)ui.route=found;else if(!initial)history.replaceState(null,'',`${location.pathname}${location.search}#inicio`);}
hydrateIcons();render();initCloud();

</script>
